<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Neuron X: four neurons joined through a lit centre neuron -->
  <rect width="32" height="32" rx="8" fill="#17161b"/>
  <g stroke="#6e6b76" stroke-width="2.4" stroke-linecap="round">
    <line x1="8" y1="8" x2="24" y2="24"/>
    <line x1="24" y1="8" x2="8" y2="24"/>
  </g>
  <g fill="#d3d0c7">
    <circle cx="8" cy="8" r="3.2"/>
    <circle cx="24" cy="8" r="3.2"/>
    <circle cx="8" cy="24" r="3.2"/>
    <circle cx="24" cy="24" r="3.2"/>
  </g>
  <circle cx="16" cy="16" r="5" fill="#ff7a4d"/>
</svg>
