<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Neuron X: four neurons joined through a lit centre neuron.
       Transparent background; corner colours follow the browser's light/dark theme. -->
  <style>
    .edge { stroke: #8f8c9c; }
    .n { fill: #3d3b44; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #6e6b76; }
      .n { fill: #d3d0c7; }
    }
  </style>
  <g class="edge" stroke-width="2.6" stroke-linecap="round">
    <line x1="5" y1="5" x2="27" y2="27"/>
    <line x1="27" y1="5" x2="5" y2="27"/>
  </g>
  <g class="n">
    <circle cx="5" cy="5" r="4"/>
    <circle cx="27" cy="5" r="4"/>
    <circle cx="5" cy="27" r="4"/>
    <circle cx="27" cy="27" r="4"/>
  </g>
  <circle cx="16" cy="16" r="6.2" fill="#ff7a4d"/>
</svg>
